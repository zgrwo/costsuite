name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  # F-10: .NET 8 SDK 用于构建 net472 + netstandard2.0 目标。
  # windows-latest 提供 .NET Framework 参考程序集，无需单独安装 targeting pack。
  DOTNET_VERSION: 8.0.x
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # duckdb.dll 为 36.7MB 原生库，按仓库策略不入库（.gitignore），
    # CI 构建前从 DuckDB 官方 Release 获取（版本锁定 v1.5.4，
    # 与 BomAnalysisProvider/DuckDB.NET.Data 1.0.2 兼容注释一致）
    - name: Fetch DuckDB native library
      shell: pwsh
      run: |
        $url = "https://github.com/duckdb/duckdb/releases/download/v1.5.4/libduckdb-windows-amd64.zip"
        $zip = Join-Path $env:RUNNER_TEMP "duckdb.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "duckdb") -Force
        Copy-Item (Join-Path $env:RUNNER_TEMP "duckdb\duckdb.dll") "src\BomAddIn\duckdb.dll" -Force
        Write-Host "duckdb.dll v1.5.4 provisioned at src/BomAddIn/"

    - name: Restore
      run: dotnet restore BomAddIn.sln

    - name: Build
      run: dotnet build BomAddIn.sln --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Unit Tests
      run: >
        dotnet test tests/BomAddIn.UnitTests/BomAddIn.UnitTests.csproj
        --configuration ${{ env.CONFIGURATION }} --no-build
        --logger "trx;LogFileName=unit-tests.trx"
        --collect:"XPlat Code Coverage" --results-directory coverage/BomAddIn.UnitTests
        --verbosity normal

    - name: Integration Tests
      run: >
        dotnet test tests/BomAddIn.IntegrationTests/BomAddIn.IntegrationTests.csproj
        --configuration ${{ env.CONFIGURATION }} --no-build
        --logger "trx;LogFileName=integration-tests.trx"
        --collect:"XPlat Code Coverage" --results-directory coverage/BomAddIn.IntegrationTests
        --verbosity normal

    # CI-1 fix: 线程安全是项目红线 (agents.md §红线1)，回归必须阻断合并
    - name: Threading Tests
      run: >
        dotnet test tests/BomAddIn.ThreadingTests/BomAddIn.ThreadingTests.csproj
        --configuration ${{ env.CONFIGURATION }} --no-build
        --logger "trx;LogFileName=threading-tests.trx"
        --verbosity normal

    - name: Performance Tests
      id: perf-tests
      continue-on-error: true
      run: >
        dotnet test tests/BomAddIn.PerformanceTests/BomAddIn.PerformanceTests.csproj
        --configuration ${{ env.CONFIGURATION }} --no-build
        --logger "trx;LogFileName=perf-tests.trx"
        --verbosity normal

    - name: Report performance test degradation
      if: steps.perf-tests.outcome == 'failure'
      shell: pwsh
      run: |
        Write-Host "::warning::Performance tests failed — results not blocking merge, but regression detected. Review perf-tests.trx for details."

    - name: Generate coverage report
      if: always()
      shell: pwsh
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.8
        $coverageDirs = @("coverage/BomAddIn.UnitTests", "coverage/BomAddIn.IntegrationTests")
        $existing = @($coverageDirs | Where-Object { Test-Path $_ })
        if ($existing.Count -gt 0) {
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage/report" -reporttypes:HtmlSummary
          Write-Host "Coverage report generated at coverage/report/"
        } else {
          Write-Host "No coverage data found, skipping report generation."
        }

    - name: Check coverage threshold (80%)
      if: always()
      shell: pwsh
      run: |
        $summaryFile = "coverage/report/Summary.txt"
        if (-not (Test-Path $summaryFile)) {
          # CI-2 fix: 覆盖率数据缺失时发出警告（而非静默通过）
          Write-Warning "No coverage summary found at $summaryFile. Coverage collection may have failed."
          Write-Host "::warning::Coverage data missing — threshold check skipped. Verify coverage collector is working."
          exit 0
        }
        $summary = Get-Content $summaryFile -Raw
        if ($summary -match 'Line coverage[:\s]+([\d.]+)%') {
          $lineCov = [double]$Matches[1]
          Write-Host "Line coverage: $lineCov%"
          if ($lineCov -lt 80.0) {
            Write-Error "Coverage $lineCov% is below 80% threshold!"
            exit 1
          }
          Write-Host "Coverage threshold met: $lineCov% >= 80%"
        } else {
          Write-Warning "Could not parse coverage percentage from summary."
          Write-Host "::warning::Coverage format unrecognized — threshold check skipped."
        }

    # Architecture compliance: Core layer must not reference ExcelDna or UI packages
    # CI-3 fix: 增强架构边界验证 — 同时检查 Data 层不引用 UI 程序集
    # 注意: Core→Data 依赖是有意设计（Service 层需要仓储），Engine 层 (VarianceCalculator) 零依赖
    - name: Validate architecture boundaries
      shell: pwsh
      run: |
        $violations = @()

        # Core 层: 禁止引用 Excel/Windows/Office
        $coreProj = Get-Content "src/BomAddIn.Core/BomAddIn.Core.csproj" -Raw
        if ($coreProj -match 'ExcelDna') { $violations += "Core references ExcelDna" }
        if ($coreProj -match 'System\.Windows') { $violations += "Core references System.Windows" }
        if ($coreProj -match 'Microsoft\.Office') { $violations += "Core references Microsoft.Office" }

        # Data 层: 禁止引用 UI 程序集和 Excel-DNA
        $dataProj = Get-Content "src/BomAddIn.Data/BomAddIn.Data.csproj" -Raw
        if ($dataProj -match 'BomAddIn\.csproj') { $violations += "Data references BomAddIn (UI)" }
        if ($dataProj -match 'ExcelDna') { $violations += "Data references ExcelDna" }

        # Infrastructure 层: 禁止引用 Core 和 Data
        $infraProj = Get-Content "src/BomAddIn.Infrastructure/BomAddIn.Infrastructure.csproj" -Raw
        if ($infraProj -match 'BomAddIn\.Core') { $violations += "Infrastructure references Core" }
        if ($infraProj -match 'BomAddIn\.Data') { $violations += "Infrastructure references Data" }

        if ($violations.Count -gt 0) {
          Write-Error "Architecture violations: $($violations -join ', ')"
          exit 1
        }
        Write-Host "Architecture validation passed: all layer boundaries respected"

    # TODO: SonarQube — add SonarCloud/SonarQube scan step (plan §5.1: "SonarQube 无 Critical")
    # CodeQL 安全扫描已配置: .github/workflows/codeql.yml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/*.trx"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          src/BomAddIn/bin/${{ env.CONFIGURATION }}/net472/publish/**/*.xll
          src/BomAddIn/bin/${{ env.CONFIGURATION }}/net472/**/*.dll
          src/BomAddIn/bin/${{ env.CONFIGURATION }}/net472/**/*.dna

  package:
    name: Package
    runs-on: windows-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: build-output

    - name: Package ZIP
      shell: pwsh
      run: |
        $distDir = "build/dist"
        New-Item -ItemType Directory -Force -Path $distDir | Out-Null

        $version = "1.1.0-ci.${{ github.run_number }}"
        $zipName = "BomAddIn-v$version-${{ env.CONFIGURATION }}.zip"
        $zipPath = Join-Path $distDir $zipName

        # ExcelDnaPack 产物 (.xll) 和依赖 DLL 已在 build-and-test 作业中编译
        $files = Get-ChildItem -Path build-output -Recurse -File |
          Where-Object { $_.Extension -match '\.(xll|dll|dna|config)$' }

        if ($files.Count -eq 0) {
          Write-Error "No build artifacts found. Check build-output directory."
          exit 1
        }

        # Max-review P1 fix: 压缩整个目录而非文件列表 — 保留 x86/x64 子目录结构。
        # 原实现用文件列表压缩会扁平化目录，导致两个同名 SQLite.Interop.dll
        # (x86/x64) 互相覆盖，且 System.Data.SQLite 无法在运行时定位原生库。
        # duckdb.dll 在 .dna 中 Pack="false"，必须与 xll 并列分发，同样依赖目录结构。
        # Max-review 建议4 fix: 先暂存工件到 staging，使 ZIP 根目录即分发结构。
        # 注：upload-artifact v4 会剥离多路径 glob 的公共前缀（src/BomAddIn/bin/
        # Release/net472/），故 download 后 build-output/ 根即 net472 目录内容。
        $srcRoot = "build-output"
        if (-not (Test-Path $srcRoot)) {
          Write-Error "Build artifacts not found at $srcRoot. Check build-and-test job."
          exit 1
        }
        $staging = "build/staging"
        New-Item -ItemType Directory -Force -Path $staging | Out-Null
        Copy-Item "$srcRoot/*" -Destination $staging -Recurse

        Compress-Archive -Path "$staging/*" -DestinationPath $zipPath -Force
        Write-Host "Distribution ZIP: $zipPath"
        Write-Host "Files: $($files.Count)"

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: build/dist/*.zip
